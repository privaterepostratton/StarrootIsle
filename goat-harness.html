<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Goat rig harness</title>
    <style>
      html, body { margin: 0; background: #14171a; color: #e8e2d4; font: 12px/1.3 system-ui, sans-serif; }
      #wrap { position: relative; }
      canvas { display: block; }
      #labels { position: absolute; inset: 0; pointer-events: none; }
      .label {
        position: absolute;
        padding: 2px 6px;
        border-radius: 5px;
        background: rgba(12, 14, 17, 0.68);
        white-space: nowrap;
      }
      #head { padding: 6px 10px; opacity: 0.8; }
      #data { padding: 6px 10px; white-space: pre; font-family: ui-monospace, monospace; font-size: 11px; opacity: 0.85; }
    </style>
  </head>
  <body>
    <div id="head"></div>
    <div id="wrap">
      <canvas id="c"></canvas>
      <div id="labels"></div>
    </div>
    <div id="data"></div>
    <script type="module" src="/src/dev/goat-harness.ts"></script>
  </body>
</html>
