<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Isle Opening — object gallery</title>
    <style>
      html, body { margin: 0; background: #14171a; color: #e8e2d4; font: 13px/1.3 system-ui, sans-serif; }
      #wrap { position: relative; }
      canvas { display: block; }
      #labels { position: absolute; inset: 0; pointer-events: none; }
      .label {
        position: absolute;
        padding: 2px 7px;
        border-radius: 6px;
        background: rgba(12, 14, 17, 0.62);
        letter-spacing: 0.02em;
        white-space: nowrap;
      }
      #head { padding: 8px 12px; font-size: 13px; opacity: 0.75; }
    </style>
  </head>
  <body>
    <div id="head"></div>
    <div id="wrap">
      <canvas id="c"></canvas>
      <div id="labels"></div>
    </div>
    <script type="module" src="/src/dev/opening-gallery.ts"></script>
  </body>
</html>
